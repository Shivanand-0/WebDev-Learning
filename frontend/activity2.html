<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Game</title>
    <link rel="stylesheet" href="activity2.css">
</head>
<body>
    <div id="box">
        <h1 id="gameName">Simon Game</h1>
        <button id="btn" >Start Game</button>
        <h3 id="level"></h3>
        <div id="lightBox" >
            <div id="lightBox1" class="colourContainer">
                <div id="red" class="colourBox "></div>
                <div id="orange" class="colourBox "></div>
            </div>
            <div id="lightBox2" class="colourContainer">
                <div id="green" class="colourBox "></div>
                <div id="blue" class="colourBox "></div>
            </div>
        </div>

    </div>
    <script src='activity2.js'></script>

</body>
</html>
